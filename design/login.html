<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logowanie</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="screen">
      <aside class="intro">
        <div class="intro-name">Factory Dashboard</div>
        <div class="intro-pitch">
          <p class="title">Tablica taśmy, decyzje i koszty wszystkich projektów</p>
          <p class="lead">Stan jest w GitHubie. Aplikacja tylko go odpytuje.</p>
        </div>
        <p class="intro-note">Token zostaje w systemowym pęku kluczy.</p>
      </aside>

      <main class="content">
        <section class="panel panel-start">
          <div class="panel-header">
            <h1 class="title">Zaloguj się</h1>
            <p class="lead">Dostaniesz kod, który wpiszesz na stronie GitHuba.</p>
          </div>
          <div class="actions">
            <button type="button" class="button">Zaloguj się przez GitHuba</button>
            <p class="note">Token zostaje w systemowym pęku kluczy.</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
